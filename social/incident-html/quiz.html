<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        background: #08090c;
        overflow: hidden;
      }
      #cv {
        display: none;
      }
      #out {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="cv" width="1080" height="1920"></canvas>
    <canvas id="out"></canvas>
    <script>
      window.FILM_END = 98;
    </script>
    <script src="assets/timing.js"></script>
    <script src="assets/geo.js"></script>
    <script src="assets/lib.js"></script>
    <script src="assets/film.js"></script>
    <script>
      // Quiz pictures and the lesson thumbnail, drawn with the film's own code (no captions, no answers).
      const q = new URLSearchParams(location.search).get("q");
      function prep() {
        g = g0;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.globalAlpha = 1;
        g.setLineDash([]);
        g.clearRect(0, 0, W, H);
      }
      function badge(x, y, r) {
        g.fillStyle = "#F5A524";
        circle(x, y, r);
        g.lineWidth = 6;
        g.strokeStyle = "#0A0C10";
        g.beginPath();
        g.arc(x, y, r, 0, TAU);
        g.stroke();
        txt("?", x, y + r * 0.44, r * 1.3, "#0A0C10", "center", 600, 0);
      }
      function crop(y0, h, ow, oh) {
        const o = document.getElementById("out");
        o.width = ow;
        o.height = oh;
        const c = o.getContext("2d");
        c.imageSmoothingQuality = "high";
        c.drawImage(cv, 0, y0, 1080, h, 0, 0, ow, oh);
      }
      document.fonts.ready.then(() => {
        prep();
        const T0 = 1000; // every chip fully shown
        if (q === "1") {
          bridge(46.95, 1.2, {
            red: true,
            people: () => {
              g.strokeStyle = "#FF6B6B"; g.lineWidth = 6; g.beginPath(); g.arc(905, 674, 66, 0, TAU); g.stroke();
              pill(1020, 530, "RED LIGHT · STARBOARD BOW", { align: "right", size: 36, h: 70, fill: "#F2555A", color: "#FFFFFF", padX: 24 });
              pill(60, 440, "OUTBOUND · STEERING 180°", { size: 36, h: 70, padX: 24 });
              badge(760, 690, 50);
            },
          });
          crop(400, 675, 960, 600);
        } else if (q === "2") {
          chart(camOf(CAM.reef), 70, { k: 13, k0: 5, labels: "BR", ice: 1, reef: 0.5, wake: 0, slick: 1, minShip: 90 });
          g.fillStyle = "rgba(255,255,255,.42)"; g.fillRect(0, 0, W, H);
          pill(90, 262, "NTSB · PROBABLE CAUSE", { size: 36, h: 70, fill: "#F5A524", color: "#0A0C10", padX: 26, ls: 1.5 });
          infoCard(T0, 0, 350, 124, "?", "Named first by the NTSB", "Which cause is missing here?", "#F5A524");
          infoCard(T0, 0, 486, 124, 2, "MASTER", "Impaired by alcohol · no proper watch", "#F2555A");
          infoCard(T0, 0, 622, 124, 3, "COMPANY", "No fit master, no rested and sufficient crew", "#F5A524");
          infoCard(T0, 0, 758, 124, 4, "TRAFFIC SERVICE · PILOTAGE", "Not effective", "#F5A524");
          crop(236, 675, 960, 600);
        } else if (q === "3") {
          const cam = { lat: 60.866, lon: -146.895, s: 150, x: 540, y: 860 };
          chart(cam, 30, { k: 9.6, k0: 5, labels: "BRI", ice: 1, reef: 0.8, minShip: 96 });
          const p = XY(cam, trackPos(9.6).ll);
          pill(60, 548, "OFF THE PLANNED TRACK", { size: 36, h: 70, fill: "#F5A524", color: "#0A0C10", padX: 24 });
          pill(60, 630, "ICE TO STARBOARD · REEF AHEAD", { size: 34, h: 66, padX: 24 });
          badge(p[0] + 78, p[1] + 96, 50);
          crop(520, 675, 960, 600);
        } else if (q === "thumb") {
          sRudder(tok(11, "reef") + 0.75);
          crop(604, 810, 352, 264);
        } else if (q === "cover") {
          draw(0.45);
          crop(0, 1920, 1080, 1920);
        }
        document.title = "done";
      });
    </script>
  </body>
</html>
